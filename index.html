<html lang="en">
<head>

    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    <style>
        /* CSS Variables for a dynamic theme */
        :root {
            /* General UI Colors - Darker, more aggressive theme */
            --bg-color: #02020c; /* Deep navy/black */
            --text-color: #f0f0f0; /* Off-white for readability */
            --card-bg: #08081a; /* Dark, subtle blue-black for cards */

            /* Blue Flame Theme Colors */
            --flame-red: #1a2ad1; /* Main blue (replaces red) */
            --flame-orange: #00bfff; /* Vibrant electric blue (replaces orange) */
            --flame-yellow: #00ffff; /* Glowing aqua (replaces yellow) */
            --flame-shadow-light: rgba(0, 255, 255, 0.4);
            --flame-shadow-dark: rgba(26, 42, 209, 0.6);
            --flame-gradient: linear-gradient(145deg, var(--flame-red) 0%, var(--flame-orange) 50%, var(--flame-yellow) 100%);
        }

        /* Light theme (currently not fully implemented for all elements, but ready) */
        [data-theme="light"] {
            --bg-color: #f0f0f0;
            --text-color: #333333;
            --card-bg: #ffffff;
            --flame-red: #3c4ce7;
            --flame-orange: #129cf3;
            --flame-yellow: #0ff1c4;
            --flame-shadow-light: rgba(15, 196, 241, 0.4);
            --flame-shadow-dark: rgba(60, 76, 231, 0.6);
            --flame-gradient: linear-gradient(145deg, var(--flame-red) 0%, var(--flame-orange) 50%, var(--flame-yellow) 100%);
        }

        /* Base Body Styles */
        body {
            margin: 0;
            font-family: 'Orbitron', sans-serif;
            background: var(--bg-color);
            color: var(--text-color);
            overflow-x: hidden;
            transition: background 0.5s ease, color 0.5s ease;
            line-height: 1.6;
            /* Smoky radial gradient for a deeper space feel */
            background-image: radial-gradient(circle at center, #08081a 0%, #02020c 70%, #000000 100%);
            background-attachment: fixed;
        }

        /* Custom scrollbar for futuristic look */
        ::-webkit-scrollbar {
            width: 12px;
        }

        ::-webkit-scrollbar-track {
            background: #1a1a2e;
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--flame-red);
            border-radius: 10px;
            border: 2px solid #1a1a2e;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--flame-orange);
        }

        /* Text selection style */
        ::selection {
            background: var(--flame-orange);
            color: var(--bg-color);
        }

        /* Header Section */
        header {
            position: relative;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            text-align: center;
            background: linear-gradient(135deg, var(--bg-color) 0%, #101030 100%);
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.5);
        }

        /* Logo Animation */
        #logo {
            width: 120px;
            height: 120px;
            margin-bottom: 25px;
            animation: spin 3s ease-out forwards;
            border-radius: 50%;
            box-shadow: 0 0 30px var(--flame-yellow); /* Glow effect with flame color */
        }

        @keyframes spin {
            from { transform: rotateY(0deg); opacity: 0; }
            to { transform: rotateY(360deg); opacity: 1; }
        }

        /* Site Title */
        #site-title {
            font-size: 4.5em;
            color: var(--text-color);
            text-shadow: 0 0 15px var(--flame-yellow), 0 0 30px var(--flame-red);
            letter-spacing: 5px;
            animation: fadeInScale 1.5s ease-out forwards;
            opacity: 0;
            transform: scale(0.8);
        }

        @keyframes fadeInScale {
            to { opacity: 1; transform: scale(1); }
        }

        /* Search Bar Styling */
        .search-container {
            margin: 40px auto;
            max-width: 600px;
            padding: 0 20px;
            animation: slideInFromTop 1s ease-out forwards;
            animation-delay: 0.5s;
            opacity: 0;
        }

        @keyframes slideInFromTop {
            from { transform: translateY(-50px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        #game-search {
            width: 100%;
            padding: 15px 20px;
            border: 2px solid var(--flame-orange);
            border-radius: 30px;
            background-color: var(--card-bg);
            color: var(--text-color);
            font-family: 'Orbitron', sans-serif;
            font-size: 1.1em;
            outline: none;
            transition: all 0.3s ease;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.3);
        }

        #game-search::placeholder {
            color: #888;
        }

        #game-search:focus {
            border-color: var(--flame-red);
            box-shadow: 0 0 15px var(--flame-yellow);
        }

        /* Filter and Sort Options */
        .filter-sort-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
            margin: 30px auto;
            max-width: 1200px;
            padding: 0 20px;
        }

        .filter-sort-container button,
        .filter-sort-container select {
            background-color: var(--card-bg);
            color: var(--text-color);
            border: 1px solid var(--flame-red);
            padding: 10px 20px;
            border-radius: 8px;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.95em;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            appearance: none;
            -webkit-appearance: none;
            -moz-appearance: none;
        }

        .filter-sort-container button:hover,
        .filter-sort-container select:hover {
            background: var(--flame-gradient);
            color: #fff;
            border-color: var(--flame-yellow);
            transform: translateY(-2px);
            box-shadow: 0 6px 15px var(--flame-shadow-dark), 0 0 10px var(--flame-yellow);
        }

        .filter-sort-container button.active,
        .filter-sort-container select.active {
            background: var(--flame-gradient);
            color: #fff;
            border-color: var(--flame-yellow);
            box-shadow: 0 6px 15px var(--flame-shadow-dark);
        }

        /* Game Library Section */
        section#library {
            padding: 50px 20px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 35px;
            max-width: 1300px;
            margin: auto;
        }

        /* Individual Game Slot */
        .slot {
            background: var(--card-bg);
            border-radius: 15px;
            padding: 15px;
            text-align: center;
            position: relative;
            transition: transform 0.4s ease, box-shadow 0.4s ease, opacity 0.4s ease;
            opacity: 0;
            transform: translateY(30px);
            animation: fadeInUp 0.6s ease forwards;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
            border: 1px solid var(--flame-red);
        }

        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .slot:hover {
            transform: translateY(-5px) scale(1.03);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.6), 0 0 30px var(--flame-shadow-light);
            border-color: var(--flame-orange);
        }

        /* Game Thumbnail Container */
        .thumbnail-container {
            width: 100%;
            height: 180px;
            background-color: #0f0f1a;
            border-radius: 10px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .thumbnail-container img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
            transition: filter 0.3s ease, transform 0.3s ease;
        }

        .thumbnail-container:hover img {
            filter: brightness(1.1);
            transform: scale(1.02);
        }

        /* Game Name */
        .slot-name {
            margin-top: 15px;
            font-size: 1.2em;
            font-weight: bold;
            color: var(--text-color);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            text-shadow: 0 0 5px rgba(0, 0, 0, 0.5);
        }

        /* Ad Placeholder */
        .adsense-placeholder {
            height: 120px;
            background: #18182a;
            margin: 50px auto;
            max-width: 970px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #666;
            border: 2px dashed var(--flame-red);
            font-size: 1.2em;
            text-transform: uppercase;
            letter-spacing: 2px;
            border-radius: 10px;
            box-shadow: inset 0 0 15px rgba(0, 0, 0, 0.5);
            animation: pulseBorder 2s infinite alternate;
        }

        @keyframes pulseBorder {
            from { border-color: var(--flame-red); }
            to { border-color: var(--flame-orange); }
        }

        /* Three Dots Menu Icon */
        .three-dots {
            position: fixed;
            top: 25px;
            right: 25px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            cursor: pointer;
            z-index: 100;
            padding: 10px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(5px);
            transition: background 0.3s ease;
        }

        .three-dots:hover {
            background: rgba(0, 0, 0, 0.5);
        }

        .dot {
            width: 8px;
            height: 8px;
            background: var(--text-color);
            border-radius: 50%;
            transition: background 0.3s ease;
        }

        /* Dropdown Menu */
        .dropdown-menu {
            position: fixed;
            top: 70px;
            right: 25px;
            background: rgba(8, 8, 26, 0.95); /* Blue-black semi-transparent */
            border: 1px solid var(--flame-red);
            padding: 20px;
            border-radius: 10px;
            display: none;
            flex-direction: column;
            gap: 15px;
            z-index: 99;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.6);
            animation: slideInRight 0.3s ease-out forwards;
            transform: translateX(100%);
            opacity: 0;
        }

        @keyframes slideInRight {
            to { transform: translateX(0); opacity: 1; }
        }

        .dropdown-menu.open {
            display: flex;
            animation: slideInRight 0.3s ease-out forwards;
        }

        .dropdown-menu button {
            background: var(--flame-red);
            color: white;
            padding: 12px 20px;
            border: none;
            cursor: pointer;
            border-radius: 8px;
            font-family: 'Orbitron', sans-serif;
            font-size: 1em;
            transition: background 0.3s ease, transform 0.2s ease, box-shadow 0.3s ease;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        }

        .dropdown-menu button:hover {
            background: var(--flame-orange);
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.4), 0 0 10px var(--flame-orange);
        }

        /* Random Game Button */
        .random-game-button-container {
            text-align: center;
            margin: 40px auto;
            animation: bounceIn 1s ease-out forwards;
            animation-delay: 0.8s;
            opacity: 0;
        }

        @keyframes bounceIn {
            0% { transform: scale(0.5); opacity: 0; }
            70% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(1); }
        }

        .random-game-button {
            background: var(--flame-gradient);
            color: #fff;
            padding: 15px 30px;
            font-size: 1.2em;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-family: 'Orbitron', sans-serif;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            box-shadow: 0 8px 20px var(--flame-shadow-dark);
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }

        .random-game-button i {
            font-size: 1.5em;
            text-shadow: 0 0 5px rgba(0, 0, 0, 0.3);
        }

        .random-game-button:hover {
            background: linear-gradient(145deg, var(--flame-red) 0%, var(--flame-orange) 50%, var(--flame-yellow) 100%);
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 12px 25px var(--flame-shadow-dark), 0 0 30px var(--flame-yellow);
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 30px 20px;
            color: #f0f0f0;
            font-size: 1em;
            /* Blue flame-inspired pattern */
            background: repeating-linear-gradient(
                45deg,
                var(--bg-color) 0%,
                var(--bg-color) 10px,
                var(--flame-red) 10px,
                var(--flame-red) 11px
            ),
            linear-gradient(to right, var(--card-bg), #0a0a2a, #1a1a4d, #0a0a2a, var(--card-bg));
            background-size: 100% 100%, cover;
            background-position: center;
            margin-top: 50px;
            border-top: 2px solid var(--flame-red);
            box-shadow: 0 -5px 25px rgba(0, 0, 0, 0.7), 0 -2px 15px var(--flame-red);
            letter-spacing: 0.8px;
            text-shadow: 0 0 10px var(--flame-shadow-light);
            position: relative;
            overflow: hidden;
        }

        /* Social Icons in footer */
        .social-icons {
            margin-top: 20px;
            display: flex;
            justify-content: center;
            gap: 25px;
            position: relative;
            z-index: 1;
        }

        .social-icons a {
            color: var(--flame-yellow);
            font-size: 1.8em;
            transition: color 0.3s ease, transform 0.2s ease, text-shadow 0.3s ease;
            text-decoration: none;
        }

        .social-icons a:hover {
            color: var(--flame-orange);
            transform: translateY(-3px) scale(1.1);
            text-shadow: 0 0 18px var(--flame-yellow);
        }

        /* Responsive Adjustments */
        @media (max-width: 768px) {
            #site-title { font-size: 3em; letter-spacing: 3px; }
            section#library {
                grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
                gap: 25px;
            }
            .slot { padding: 10px; }
            .thumbnail-container { height: 140px; }
            .slot-name { font-size: 1em; }
            .random-game-button { padding: 12px 25px; font-size: 1.1em; }
            .adsense-placeholder { height: 100px; margin: 30px auto; }
            .three-dots { top: 15px; right: 15px; }
            .dropdown-menu { top: 60px; right: 15px; padding: 15px; }
            .filter-sort-container {
                flex-direction: column;
                align-items: center;
            }
            .filter-sort-container button,
            .filter-sort-container select {
                width: 80%;
            }
            .social-icons {
                gap: 15px;
            }
            .social-icons a {
                font-size: 1.5em;
            }
        }

        @media (max-width: 480px) {
            #site-title { font-size: 2.2em; letter-spacing: 2px; }
            #logo { width: 90px; height: 90px; }
            section#library { gap: 20px; }
            .thumbnail-container { height: 120px; }
            .random-game-button { font-size: 1em; padding: 10px 20px; }
            .adsense-placeholder { height: 80px; }
        }
    </style>
</head>
<body>

    <div class="three-dots" onclick="toggleMenu()">
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
    </div>

    <div class="dropdown-menu" id="menu">
        <button onclick="toggleTheme()">Toggle Dark/Light</button>
        <button onclick="showAlert('Login/Signup feature coming soon! You\'ll be able to save progress and more.')">Login / Signup</button>
        <button onclick="showAlert('Favorites feature coming soon! Mark your favorite games for quick access.')">Favorites</button>
        <button onclick="showAlert('Profile feature coming soon!')">Profile</button>
        <button onclick="showAlert('Settings feature coming soon!')">Settings</button>
        <button onclick="showAlert('Help section coming soon!')">Help</button>
    </div>

    <div id="custom-alert" style="
        display: none;
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        background-color: var(--card-bg);
        border: 2px solid var(--flame-red);
        border-radius: 10px;
        padding: 30px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
        z-index: 101;
        text-align: center;
        max-width: 400px;
        width: 90%;
        font-family: 'Orbitron', sans-serif;
        color: var(--text-color);
    ">
        <p id="alert-message" style="font-size: 1.1em; margin-bottom: 20px;"></p>
        <button onclick="hideAlert()" style="
            background-color: var(--flame-orange);
            color: #fff;
            padding: 10px 25px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-family: 'Orbitron', sans-serif;
            font-size: 1em;
            transition: background-color 0.3s ease, transform 0.2s ease;
        ">OK</button>
    </div>

    <header>
        <img src="https://raw.githubusercontent.com/gamesyte/gamesyte.github.io/main/logo.png" id="logo" alt="GameSyte Logo"/>
        <div id="site-title">GameSyte</div>
    </header>

    <div class="search-container">
        <input type="text" id="game-search" placeholder="Search for games..." onkeyup="applyFiltersAndSort()">
    </div>

    <div class="filter-sort-container">
        <button id="filter-all" class="active" onclick="setFilter('all')">All Games</button>
        <button id="filter-new" onclick="setFilter('new')">New Games</button>
        <button id="filter-popular" onclick="setFilter('popular')">Popular Games</button>
        <select id="category-filter" onchange="filterByCategory(this.value)">
            <option value="all-categories">All Categories</option>
            </select>
    </div>

    <div class="adsense-placeholder">[ Ad Placeholder ]</div>

    <div class="random-game-button-container">
        <button onclick="goToRandomGame()" class="random-game-button">
            <i class="fas fa-dice"></i> Play a Random Game
        </button>
    </div>
    
    <section id="library"></section>

    <div class="adsense-placeholder">[ Ad Placeholder ]</div>

    <footer>
        <p>&copy; 2025 GameSyte. All rights reserved. [Version 2.1]</p>
        <div class="social-icons">
            <a href="#" aria-label="Visit us on Twitter"><i class="fab fa-twitter"></i></a>
            <a href="#" aria-label="Visit us on Facebook"><i class="fab fa-facebook-f"></i></a>
            <a href="#" aria-label="Visit us on Instagram"><i class="fab fa-instagram"></i></a>
            <a href="#" aria-label="Visit us on Discord"><i class="fab fa-discord"></i></a>
        </div>
    </footer>

    <script>
        let gameList = []; // Stores all fetched games
        let currentFilterType = 'all'; // 'all', 'new', 'popular', 'category'
        let currentCategory = 'all-categories'; // Specific category name

        // Custom alert function (replaces window.alert)
        function showAlert(message) {
            const alertBox = document.getElementById('custom-alert');
            const alertMessage = document.getElementById('alert-message');
            alertMessage.textContent = message;
            alertBox.style.display = 'block';
        }

        function hideAlert() {
            document.getElementById('custom-alert').style.display = 'none';
        }

        // Fetches game data from games.json and enriches it
        async function fetchGames() {
            try {
                const response = await fetch('games.json');
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                gameList = await response.json();
                
                // --- Simulate additional game properties for demonstration ---
                // In a real scenario, these would come directly from your games.json
                const categories = ['Action', 'Puzzle', 'Arcade', 'Adventure', 'Sports', 'Strategy', 'Simulation', 'Multiplayer', 'Racing', 'Casual'];
                const getRandomCategory = () => categories[Math.floor(Math.random() * categories.length)];
                
                gameList = gameList.map((game, index) => {
                    // Add dummy categories, releaseDate, and popularityScore
                    const gameCategories = Array.from({ length: Math.floor(Math.random() * 3) + 1 }, getRandomCategory);
                    const releaseDate = new Date(2024, Math.floor(Math.random() * 12), Math.floor(Math.random() * 28) + 1);
                    const popularityScore = Math.floor(Math.random() * 1000) + 100; // Random score between 100 and 1099

                    return {
                        ...game,
                        categories: game.categories || gameCategories, // Use existing if present, else dummy
                        releaseDate: game.releaseDate || releaseDate.toISOString().split('T')[0], // YYYY-MM-DD
                        popularityScore: game.popularityScore || popularityScore
                    };
                });
                // --- End simulation ---

                populateCategories(); // Populate category dropdown
                applyFiltersAndSort(); // Apply initial filters and render
            } catch (error) {
                console.error("Could not fetch games:", error);
                showAlert("Failed to load games. Please try again later.");
            }
        }

        // Populates the category dropdown with unique categories
        function populateCategories() {
            const categoryFilter = document.getElementById('category-filter');
            const allCategories = new Set();
            gameList.forEach(game => {
                game.categories.forEach(cat => allCategories.add(cat));
            });

            // Clear existing options except "All Categories"
            categoryFilter.innerHTML = '<option value="all-categories">All Categories</option>';
            
            Array.from(allCategories).sort().forEach(category => {
                const option = document.createElement('option');
                option.value = category;
                option.textContent = category;
                categoryFilter.appendChild(option);
            });
        }

        // Sets the filter type (All, New, Popular)
        function setFilter(type) {
            currentFilterType = type;
            currentCategory = 'all-categories'; // Reset category filter when changing type
            document.getElementById('category-filter').value = 'all-categories';
            
            // Update active button styling
            document.querySelectorAll('.filter-sort-container button').forEach(btn => {
                btn.classList.remove('active');
            });
            document.getElementById(`filter-${type}`).classList.add('active');

            applyFiltersAndSort();
        }

        // Filters by selected category
        function filterByCategory(category) {
            currentCategory = category;
            currentFilterType = 'category'; // Set filter type to category
            
            // Remove active class from other filter buttons
            document.querySelectorAll('.filter-sort-container button').forEach(btn => {
                btn.classList.remove('active');
            });

            applyFiltersAndSort();
        }

        // Applies all current filters and sorting, then renders games
        function applyFiltersAndSort() {
            const searchTerm = document.getElementById('game-search').value.toLowerCase();
            let filteredAndSortedGames = [...gameList]; // Start with a fresh copy

            // 1. Apply Search Filter
            if (searchTerm) {
                filteredAndSortedGames = filteredAndSortedGames.filter(game =>
                    game.name.toLowerCase().includes(searchTerm)
                );
            }

            // 2. Apply Type Filter (New, Popular, All, Category)
            if (currentFilterType === 'new') {
                // Sort by release date (descending) and take top N (e.g., 20)
                filteredAndSortedGames.sort((a, b) => new Date(b.releaseDate) - new Date(a.releaseDate));
                filteredAndSortedGames = filteredAndSortedGames.slice(0, 20); // Show top 20 new games
            } else if (currentFilterType === 'popular') {
                // Sort by popularity score (descending) and take top N (e.g., 20)
                filteredAndSortedGames.sort((a, b) => b.popularityScore - a.popularityScore);
                filteredAndSortedGames = filteredAndSortedGames.slice(0, 20); // Show top 20 popular games
            } else if (currentFilterType === 'category' && currentCategory !== 'all-categories') {
                filteredAndSortedGames = filteredAndSortedGames.filter(game =>
                    game.categories && game.categories.includes(currentCategory)
                );
            }
            // 'all' type means no specific sorting or category filtering beyond search

            renderGames(filteredAndSortedGames);
        }

        // Renders games to the library section
        function renderGames(games) {
            const library = document.getElementById("library");
            library.innerHTML = ''; // Clear existing games before rendering

            if (games.length === 0) {
                library.innerHTML = '<p style="text-align: center; color: #aaa; font-size: 1.2em; margin-top: 50px;">No games found matching your criteria.</p>';
                return;
            }

            games.forEach((game, i) => {
                const div = document.createElement("div");
                div.className = "slot";
                div.style.animationDelay = `${i * 0.08}s`; // Staggered animation

                const link = `https://gamesyte.github.io/${game.directory}/index.html`;
                const image = `https://gamesyte.github.io/${game.directory}/${game.image}`;

                div.innerHTML = `
                    <div class="thumbnail-container" onclick="window.location.href='${link}'">
                        <img src="${image}" alt="${game.name} Thumbnail" onerror="this.onerror=null;this.src='https://placehold.co/300x200/1a1a2e/e0e0e0?text=No+Image';">
                    </div>
                    <div class="slot-name">${game.name}</div>
                `;
                library.appendChild(div);
            });
        }

        // Navigates to a random game
        function goToRandomGame() {
            if (gameList.length === 0) {
                showAlert("No games available to play randomly!");
                return;
            }
            const random = gameList[Math.floor(Math.random() * gameList.length)];
            const url = `https://gamesyte.github.io/${random.directory}/index.html`;
            window.location.href = url;
        }

        // Toggles the dropdown menu visibility
        function toggleMenu() {
            const menu = document.getElementById('menu');
            menu.classList.toggle('open');
        }

        // Toggles between dark and light themes
        function toggleTheme() {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            if (currentTheme === 'light') {
                document.documentElement.removeAttribute('data-theme');
            } else {
                document.documentElement.setAttribute('data-theme', 'light');
            }
        }

        // Initialize game fetching when the window loads
        window.onload = fetchGames;

        // Smoothly close menu if clicked outside
        document.addEventListener('click', (e) => {
            const dots = document.querySelector('.three-dots');
            const menu = document.getElementById('menu');
            const customAlert = document.getElementById('custom-alert');
            const filterSortContainer = document.querySelector('.filter-sort-container');

            // Close menu if click is outside dots and menu, and not on the alert box or filter/sort container
            if (!menu.contains(e.target) && !dots.contains(e.target) && !customAlert.contains(e.target) && !filterSortContainer.contains(e.target)) {
                menu.classList.remove('open');
            }
        });
    </script>
</body>
</html>
